name: Release

# Builds and publishes:
#  - Windows: NSIS installer + portable exe (zip)
#  - macOS:   .dmg (universal-ish: aarch64 + x86_64)
#  - Linux:   .deb + .AppImage
#  - Linux:   Flatpak (com.neelima.app)
#  - Phase-0 spike self-test reports for all three OSes (per-OS evidence)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            portable: true
          - os: macos-latest
            bundles: dmg
          - os: ubuntu-22.04
            bundles: appimage deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev git

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Frontend deps
        run: npm --prefix ui ci || npm --prefix ui install

      - name: Build (${{ matrix.os }})
        run: npx --prefix ui tauri build --bundles ${{ matrix.bundles }}

      - name: Import Windows signing certificate
        if: matrix.portable
        id: signing-certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE_PFX_BASE64) -or
              [string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Configure WINDOWS_CERTIFICATE_PFX_BASE64 and WINDOWS_CERTIFICATE_PASSWORD as GitHub Actions secrets before creating a Windows release."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "neelima-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfxPath `
              -CertStoreLocation Cert:\CurrentUser\My -Password $password |
              Where-Object {
                $_.HasPrivateKey -and
                $_.EnhancedKeyUsageList.ObjectId.Value -contains "1.3.6.1.5.5.7.3.3"
              } |
              Select-Object -First 1

            if ($null -eq $cert) {
              throw "The PFX did not contain a private-key certificate valid for code signing."
            }
            if ($cert.EnhancedKeyUsageList.ObjectId.Value -notcontains "1.3.6.1.5.5.7.3.3") {
              throw "The imported certificate is not valid for code signing."
            }

            "thumbprint=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Sign and verify Windows executables
        if: matrix.portable
        id: sign-windows
        shell: pwsh
        env:
          CERTIFICATE_THUMBPRINT: ${{ steps.signing-certificate.outputs.thumbprint }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) {
            throw "Windows SDK signtool.exe was not found on the runner."
          }

          $releaseDirs = @("target/release", "src-tauri/target/release")
          $appBinaries = @($releaseDirs | ForEach-Object {
            $candidate = Join-Path $_ "neelima.exe"
            if (Test-Path $candidate) { Get-Item $candidate }
          })
          if ($appBinaries.Count -ne 1) {
            throw "Expected exactly one release neelima.exe, found $($appBinaries.Count)."
          }

          $installerBinaries = @($releaseDirs | ForEach-Object {
            $bundlePath = Join-Path $_ "bundle/nsis"
            if (Test-Path $bundlePath) {
              Get-ChildItem $bundlePath -Filter "*.exe" -File
            }
          })
          $binaries = @($appBinaries) + @($installerBinaries)
          if ($binaries.Count -lt 2) {
            throw "Expected the app executable and at least one NSIS installer to sign."
          }

          foreach ($binary in $binaries) {
            & $signtool.FullName sign /s My /sha1 $env:CERTIFICATE_THUMBPRINT `
              /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 $binary.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode signing failed for $($binary.FullName)."
            }

            & $signtool.FullName verify /pa /all /v $binary.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode signature verification failed for $($binary.FullName)."
            }
          }

          "app_exe=$($appBinaries[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Package portable exe (Windows)
        if: matrix.portable
        shell: pwsh
        env:
          APP_EXE_PATH: ${{ steps.sign-windows.outputs.app_exe }}
        run: |
          if (-not (Test-Path $env:APP_EXE_PATH)) {
            throw "Signed portable executable was not found: $env:APP_EXE_PATH"
          }
          Compress-Archive -Path $env:APP_EXE_PATH -DestinationPath Neelima-portable-windows-x64.zip

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          find target/release/bundle src-tauri/target/release/bundle -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" \) -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: neelima-${{ matrix.os }}
          path: |
            dist/*
            Neelima-portable-windows-x64.zip

  flatpak:
    runs-on: ubuntu-22.04
    continue-on-error: true  # best-effort: verify after first tag build
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --if-not-exists --user -y flathub org.gnome.Platform//47 org.gnome.Sdk//47 org.freedesktop.Sdk.Extension.rust-stable//24.08 org.freedesktop.Sdk.Extension.node22//24.08
      - name: Build Flatpak
        run: |
          flatpak-builder --user --force-clean --repo=repo build-dir packaging/flatpak/com.neelima.app.yml
          flatpak build-bundle repo Neelima.flatpak com.neelima.app
      - uses: actions/upload-artifact@v4
        with:
          name: neelima-flatpak
          path: Neelima.flatpak

  phase0-spike:
    # Per-OS Phase-0 evidence: the spike app self-tests multiwebview, per-profile
    # data dirs, the capability-scoped bridge, and DOM automation.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run spike self-test (run 1)
        shell: bash
        run: |
          cd spike/src-tauri
          cargo run -- --selftest --run 1 --report ../../docs/spike-report-${{ matrix.os }}.md
      - name: Run spike self-test (run 2 — persistence)
        shell: bash
        run: |
          cd spike/src-tauri
          cargo run -- --selftest --run 2 --report ../../docs/spike-report-${{ matrix.os }}-run2.md
      - uses: actions/upload-artifact@v4
        with:
          name: phase0-spike-${{ matrix.os }}
          path: docs/spike-report-*.md
