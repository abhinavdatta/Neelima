[package]
name = "neelima"
description = "Neelima — local-first agentic coding app. Embeds the AI provider's own web chat (your account, your login) or local models, and lets them read and modify files in your workspace. No cloud model APIs, no API keys, no telemetry."
version = "0.1.0"
edition = "2021"
license = "MIT"
default-run = "neelima"

[lib]
name = "neelima_lib"
crate-type = ["rlib"]

[[bin]]
name = "neelima"
path = "src/main.rs"

[features]
# Use the bundled UI by default so standalone builds do not depend on a Vite
# server. `tauri dev` starts the Vite server through beforeDevCommand.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
portable-pty = "0.8"
notify = "8"
regex = "1"
ignore = "0.4"
globset = "0.4"
dunce = "1"
similar = "2"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security"] }

[dev-dependencies]
tauri = { version = "2", features = ["unstable", "test"] }
tempfile = "3"
# test-util enables paused-clock tests (tokio::time::advance / start_paused)
# used by tests/action_bridge_e2e.rs. Dev-only; the release binary is unaffected.
tokio = { version = "1", features = ["test-util"] }
